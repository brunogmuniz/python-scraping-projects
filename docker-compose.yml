services:
  db:
    image: postgres:16-alpine
    container_name: ufsm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ufsm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ufsm_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  ufsm_data: